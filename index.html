<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally – expenses & receipts</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#683e87">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --ink:#16212A; --muted:#5B6870; --line:#D3DBD9;
  --biz:#0D6B66; --biz-soft:#DCEFEC; --per:#6A3D8C; --per-soft:#ECE3F3;
  --neg:#A4302A; --pos:#2C7A4D; --paper:#FBFBF6; --shadow:0 1px 0 rgba(22,33,42,.06),0 6px 18px -10px rgba(22,33,42,.25);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11171B; --surface:#1A2227; --ink:#E6ECEA; --muted:#93A2A8; --line:#2B363C;
    --biz:#45B5AB; --biz-soft:#173431; --per:#B78DDA; --per-soft:#2B2236;
    --neg:#F08C82; --pos:#72CF98; --paper:#20292E; --shadow:0 6px 18px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171B; --surface:#1A2227; --ink:#E6ECEA; --muted:#93A2A8; --line:#2B363C;
  --biz:#45B5AB; --biz-soft:#173431; --per:#B78DDA; --per-soft:#2B2236;
  --neg:#F08C82; --pos:#72CF98; --paper:#20292E; --shadow:0 6px 18px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  --acc:var(--per);--acc-soft:var(--per-soft)}
body.business{--acc:var(--biz);--acc-soft:var(--biz-soft)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;height:58px}
.bookpill{display:flex;align-items:center;gap:8px;border:0;background:var(--acc-soft);color:var(--acc);font-weight:700;padding:7px 12px 7px 10px;border-radius:999px}
.bookpill .dot{width:10px;height:10px;border-radius:50%;background:var(--acc)}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em;flex:1}

/* chooser */
.chooser{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:28px 16px 24px;max-width:640px;margin:0 auto}
.chooser .brand{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:8px 0 6px}
.chooser p{margin:0 0 24px;color:var(--muted)}
.books{display:grid;gap:14px;flex:1;align-content:start}
.booktile{display:block;width:100%;text-align:left;border:0;border-radius:22px;padding:22px 22px 20px;color:#fff;position:relative;overflow:hidden}
.booktile.personal{background:var(--per)}
.booktile.business{background:var(--biz)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .booktile{color:#0F1418}}
:root[data-theme="dark"] .booktile{color:#0F1418}
.booktile .name{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.booktile .sub{opacity:.85;font-size:14px;margin-top:4px}
.booktile .name,.booktile .sub{position:relative}
.booktile .fig{position:relative;margin-top:16px;font-size:14px;opacity:.9;max-width:75%}
.booktile .fig b{display:block;font-size:24px;font-weight:700;opacity:1}
.booktile .big{position:absolute;right:-6px;bottom:-30px;font-size:120px;font-weight:800;opacity:.14;letter-spacing:-.06em;line-height:1}
.chooser .foot{display:flex;gap:10px;margin-top:20px}
.snaprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.snaprow button{border:2px dashed var(--line);background:var(--surface);border-radius:16px;padding:14px 10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px}
.snaprow button span{font-size:28px;line-height:1}
.snaprow [data-snap="personal"]{color:var(--per);border-color:var(--per)}
.snaprow [data-snap="business"]{color:var(--biz);border-color:var(--biz)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600}

/* month */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
.monthnav h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center}
.totals{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.totals div{padding:14px 12px}
.totals div+div{border-left:1px solid var(--line)}
.totals small{display:block;color:var(--muted);font-size:13px}
.totals b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.bars{margin:14px 0 4px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.bar .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--acc);border-radius:3px}
.day{margin-top:18px}
.dayhead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:0 4px 6px}
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 14px}
.row+.row{border-top:1px solid var(--line)}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;font-size:19px;flex:none}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted)}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row .amt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* receipts */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px}
.rcpt{border:0;padding:0;background:var(--paper);color:var(--ink);text-align:left;box-shadow:var(--shadow);
  --s:12px;padding-bottom:10px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/var(--s) 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/var(--s) 100%}
.rcpt img{display:block;width:100%;height:150px;object-fit:cover;background:var(--line)}
.rcpt .meta{padding:10px 12px 8px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;line-height:1.5}
.rcpt .meta .p{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.rcpt .meta .dash{border-top:1px dashed var(--muted);margin:6px 0;opacity:.6}
.rcpt .meta .tot{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.snap{display:flex;align-items:center;gap:12px;width:100%;border:2px dashed var(--acc);background:var(--acc-soft);color:var(--acc);border-radius:16px;padding:16px;font-weight:700;margin-top:14px}
.snap span{font-size:26px}

/* taxes */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-top:14px}
.card h3{margin:0 0 2px;font-size:18px;font-weight:800;letter-spacing:-.01em}
.card .lede{color:var(--muted);font-size:14px;margin:0 0 12px}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-variant-numeric:tabular-nums}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k small{display:block;color:var(--muted);font-size:12.5px}
.kv.total{font-weight:700}
.line{color:var(--muted);font-size:12.5px;font-family:"IBM Plex Mono",ui-monospace,monospace;margin-right:6px}
.warn{background:#FFF4D6;color:#5C4300;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3A3017;color:#F3DFA4}}
:root[data-theme="dark"] .warn{background:#3A3017;color:#F3DFA4}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0F1418}}
:root[data-theme="dark"] .btn{color:#0F1418}
.btn.wide{width:100%}
.btn.sec{background:var(--acc-soft);color:var(--acc)}
.btn.danger{background:none;color:var(--neg);border:1px solid var(--line)}
.btnrow{display:flex;gap:10px;margin-top:10px}
.btnrow>*{flex:1}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;height:64px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600;padding:6px 0}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--acc)}
nav.tabs .fab{width:56px;height:56px;margin:-26px auto 0;border-radius:18px;background:var(--acc);color:#fff;font-size:30px;font-weight:400;box-shadow:0 8px 20px -8px var(--acc);justify-content:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs .fab{color:#0F1418}}
:root[data-theme="dark"] nav.tabs .fab{color:#0F1418}
main{padding-bottom:110px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,18,.5);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;
  transform:translateY(105%);transition:transform .22s ease;padding:8px 0 calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet{visibility:hidden;transform:translateY(calc(100% + 40px))}
.sheet.open{visibility:visible;transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .wrap{max-width:560px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheethead h2{margin:0;font-size:20px;font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.amountbox{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--acc);padding:4px 2px;margin-bottom:14px}
.amountbox span{font-size:28px;font-weight:700;color:var(--muted)}
.amountbox input{border:0;background:none;font-size:38px;font-weight:800;width:100%;outline:none;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 5px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.inrow{display:flex;gap:8px}
.inrow .in{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip small{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--muted);font-weight:400;font-size:11px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0F1418}}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0F1418}
.cathint{font-size:13px;color:var(--muted);margin-top:6px;min-height:1em}
.photo{display:flex;gap:12px;align-items:center;margin-top:4px}
.photo img{width:84px;height:104px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.photo .acts{display:flex;flex-direction:column;gap:6px;flex:1}
.status{font-size:14px;margin-top:8px;color:var(--muted);min-height:1.2em}
.status.busy::before{content:"";display:inline-block;width:12px;height:12px;border:2px solid var(--acc);border-right-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.show{opacity:1}
.hidden{display:none!important}
.booktile.bx{background:var(--tb)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .booktile.bx{background:var(--tbd)}}
:root[data-theme="dark"] .booktile.bx{background:var(--tbd)}
.addbiz{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:2px dashed var(--line);background:var(--surface);color:var(--ink);border-radius:22px;padding:18px 22px;font-weight:800;font-size:18px;width:100%}
.addbiz span{font-size:24px;line-height:1;color:var(--acc)}
.addbiz small{font-weight:400;color:var(--muted);font-size:13.5px}
textarea.in{resize:vertical;font-family:inherit;line-height:1.45}
.it{border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;background:var(--surface)}
.sigpad{position:fixed;inset:0;z-index:36;background:var(--bg);display:none;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sigpad.open{display:flex}
.sigpad canvas{flex:1;min-height:200px;width:100%;background:#fff;border:2px dashed var(--line);border-radius:14px;touch-action:none;margin-top:10px}
.tl{margin:0 0 14px;padding-left:20px}.tl li{margin:7px 0}
.terms h4{margin:16px 0 4px;font-size:15px}.terms p{margin:0;color:var(--muted);font-size:14.5px}
.askbar{display:flex;gap:8px;margin:16px 0 10px}
.askbar .in{flex:1;font-size:16px}
.bub{padding:10px 14px;border-radius:16px;margin:10px 0;max-width:92%;line-height:1.5;font-size:15px;overflow-wrap:anywhere}
.bub.me{background:var(--acc);color:#fff;margin-left:auto;border-bottom-right-radius:6px;width:fit-content}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bub.me{color:#0F1418}}
:root[data-theme="dark"] .bub.me{color:#0F1418}
.bub.ai{background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.bub.ai ul{margin:4px 0 6px;padding-left:20px}
.bub.ai li{margin:2px 0}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.paygrid .wide{grid-column:1/-1}
.payhead{display:block;margin:20px 0 0;font-weight:800;font-size:16px}
.cam{position:fixed;inset:0;z-index:35;background:#000;display:none;flex-direction:column}
.cam.open{display:flex}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cammsg{position:absolute;left:16px;right:16px;top:calc(20px + env(safe-area-inset-top,0px));color:#fff;text-align:center;font-size:15px;line-height:1.4;text-shadow:0 1px 3px #000}
.cambar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px calc(18px + env(safe-area-inset-bottom,0px));background:#000}
.camb{background:#262626;color:#fff;border:0;border-radius:12px;padding:10px 14px;min-width:88px;text-align:center;font-weight:600;cursor:pointer}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000}
.shutter:disabled{opacity:.35}
.vh{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{display:block;text-align:center;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs hidden" id="tabs" aria-label="Sections">
  <div class="wrap">
    <button data-view="month"><span>📅</span>Month</button>
    <button data-view="receipts" id="tabR"><span>🧾</span>Receipts</button>
    <button class="fab" id="fab" aria-label="Add entry">+</button>
    <button data-view="ask"><span>💬</span>Ask</button>
    <button data-view="taxes"><span>🍁</span>Taxes</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle"><div class="wrap" id="sheetbody"></div></section>
<div class="lightbox" id="lightbox"><img alt="Receipt"></div>
<div class="cam" id="cam" role="dialog" aria-label="Camera"><video id="camv" playsinline autoplay muted poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video><div class="cammsg" id="cammsg"></div><div class="cambar"><button class="camb" id="camx">Cancel</button><button class="shutter" id="shot" aria-label="Take photo"></button><label class="camb" for="galleryIn" id="camgal">Gallery</label></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" class="vh" tabindex="-1" aria-hidden="true">
<input type="file" id="galleryIn" accept="image/*,application/pdf" multiple class="vh" tabindex="-1" aria-hidden="true">
<input type="file" id="docIn" accept="application/pdf,image/*" class="vh" tabindex="-1" aria-hidden="true">
<div class="sigpad" id="sigpad" role="dialog" aria-label="Client signature"><h2 style="margin:0 0 4px">Client signature</h2><p class="note" style="margin:0 0 10px" id="sigTxt"></p><input class="in" id="sigName" placeholder="Client’s full name" autocomplete="off"><canvas id="sigc"></canvas><div class="btnrow"><button class="btn danger" id="sigX">Cancel</button><button class="btn sec" id="sigClr">Clear</button><button class="btn" id="sigOk">Accept</button></div></div>
<input type="file" id="restoreIn" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">

<script>
/* ---------- categories ---------- */
const CATS = {
  personal:{
    expense:[
      {id:'food',name:'Restaurants',icon:'🍽'},{id:'groceries',name:'Groceries',icon:'🛒'},
      {id:'bills',name:'Bills & utilities',icon:'💡'},{id:'home',name:'Rent / home',icon:'🏠'},
      {id:'car',name:'Car & gas',icon:'🚗'},{id:'transport',name:'Transit',icon:'🚌'},

    let o=`**${yy} check-up (${bookLabel(st.book)})**\n- Expenses: ${fm(sum(E))} in ${E.length} entries\n- Income: ${fm(sum(I))}\n- GST/HST paid: ${fm(tx(E))}`;
    if(noTax)o+=`\n- ${noTax} business expense${noTax===1?'':'s'} of $30 or more ${noTax===1?'has':'have'} no GST/HST amount. Check if tax was charged.`;

  }

  }
  if(/gst|hst|sales tax/.test(L)){
    const E=ex.filter(e=>e.date.startsWith(String(y)));

  }

}

function dateCands(str){

  const mk=(y,m,d)=>{if(y<100)y+=2000;if(!(m>=1&&m<=12&&d>=1&&d<=31))return null;const dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1)return null;return `${y}-${pad(m)}-${pad(d)}`};
  const add=(y,m,d)=>{const x=mk(y,m,d);if(x&&x>=lo&&x<=hi&&!out.includes(x))out.push(x)};
  const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12,janv:1,'févr':2,fevr:2,mars:3,avr:4,mai:5,juin:6,juil:7,'août':8,aout:8,'déc':12};

function renderMonth(){

  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const days={};list.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));

let pdfjsP=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(!pdfjsP)pdfjsP=new Promise((res,rej)=>{
    const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    const add=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
    add(base+'pdf.worker.min.js').then(()=>add(base+'pdf.min.js')).then(()=>{const L=window.pdfjsLib;if(!L)throw new Error('pdfjs');L.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';res(L)}).catch(e=>{pdfjsP=null;rej(e)});
  });
  return pdfjsP;
}
async function pdfToImage(file){
  const L=await loadPdfJs();
  const pdf=await L.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  const page=await pdf.getPage(1);
  const v1=page.getViewport({scale:1}),sc=Math.min(3,1800/Math.max(v1.width,v1.height)),vp=page.getViewport({scale:sc});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:g,viewport:vp}).promise;
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));if(!blob)throw new Error('render');return blob;
}

function docTotals(d){
  const sub=r2((d.items||[]).reduce((a,it)=>a+(parseFloat(it.q)||0)*(parseFloat(it.p)||0),0));
  const tax=d.taxOn?r2(sub*(+d.rate||0)/100):0, total=r2(sub+tax);

  const paid=d.type==='invoice'&&d.id?r2(st.entries.filter(e=>e.invoice===d.id).reduce((a,e)=>a+e.amount,0)):0;
  return{sub,tax,total,dep,paid,bal:r2(total-paid)};
}
function invStatus(d){const t=docTotals(d);if(t.total>0&&t.paid>=t.total-0.005)return 'Paid';if(t.paid>0)return 'Partly paid';if(d.due&&d.due<today())return 'Overdue';return 'Unpaid'}
function projStats(p){

  st.entries.forEach(e=>{if(e.project!==p.id||e.book!=='business')return;if(e.kind==='income')recv+=e.amount;else spent+=e.amount});
  let invoiced=0,owed=0;
  st.docs.filter(d=>d.project===p.id&&d.type==='invoice').forEach(d=>{const t=docTotals(d);invoiced+=t.total;owed+=Math.max(0,t.bal)});
  const q=st.docs.filter(d=>d.project===p.id&&d.type==='quote').sort((a,b)=>((b.status==='accepted')-(a.status==='accepted'))||((b.created||0)-(a.created||0)))[0];
  return{spent:r2(spent),recv:r2(recv),invoiced:r2(invoiced),owed:r2(owed),quoted:q?docTotals(q).total:0,profit:r2(recv-spent)};
}
function nextNum(type){

  pad.classList.add('open');
  const c=$('#sigc'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const clear=()=>{g.fillStyle='#fff';g.fillRect(0,0,r.width,r.height)};clear();
  g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#111';
  let drawing=false,drawn=false;
  c.onpointerdown=e=>{drawing=true;drawn=true;try{c.setPointerCapture(e.pointerId)}catch{}g.beginPath();g.moveTo(e.offsetX,e.offsetY)};
  c.onpointermove=e=>{if(!drawing)return;g.lineTo(e.offsetX,e.offsetY);g.stroke()};
  c.onpointerup=c.onpointercancel=()=>{drawing=false};
  $('#sigClr').onclick=()=>{clear();drawn=false};
  $('#sigX').onclick=()=>pad.classList.remove('open');
  $('#sigOk').onclick=async()=>{
    if(!drawn){toast('Ask the client to sign in the box');return}
    const nm=$('#sigName').value.trim();if(!nm){toast('Enter the client’s name');$('#sigName').focus();return}
    const s=document.createElement('canvas');s.width=500;s.height=Math.max(1,Math.round(500*r.height/r.width));s.getContext('2d').drawImage(c,0,0,s.width,s.height);

    pad.classList.remove('open');

  };
}

async function makeDocPdf(d){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'letter'});
  const W=612,H=792,M=48,R=W-M;let Y=M;
  const T=s=>String(s??'').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/[^\x20-\x7E\xA0-\xFF\n]/g,'');
  const $m=n=>(n<0?'-':'')+'$'+Math.abs(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  const font=(sz,b)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(sz)};
  const gray=v=>doc.setTextColor(v,v,v);
  const need=h=>{if(Y+h>H-60){doc.addPage();Y=M}};
  const wrap=(txt,w)=>doc.splitTextToSize(T(txt),w);

function fillPay(res){
  const n=v=>+v>0?r2(v).toFixed(2):'';

    draft.kind='expense';draft.cat='wages';draft.tax='';
    if(res.employee)draft.payee=String(res.employee).slice(0,60);
    setResDate(res);
    draft.pay={period:String(res.period||'').slice(0,40),gross:n(res.gross),itax:n(res.itax),cpp:n(res.cpp),ei:n(res.ei),ercpp:n(res.ercpp),erei:n(res.erei),net:n(res.net)};
    const tot=(+res.gross||0)+(+res.ercpp||0)+(+res.erei||0);if(tot>0)draft.amount=r2(tot).toFixed(2);
    return;
  }
  draft.kind='income';draft.cat='pay';draft.tax='';
  if(+res.net>0)draft.amount=r2(res.net).toFixed(2);
  if(res.employer)draft.payee=String(res.employer).slice(0,60);

async function buildBackup(){
  const receipts=[];for(const e of st.all){for(const pid of photoIds(e)){const r=await S.getReceipt(pid).catch(()=>null);if(r)receipts.push({id:r.id,data:await blobToDataURL(r.blob)})}}
  for(const d of st.allD){if(d.fileId){const r=await S.getReceipt(d.fileId).catch(()=>null);if(r)receipts.push({id:r.id,data:await blobToDataURL(r.blob)})}}
  return new Blob([JSON.stringify({app:'tally',version:2,saved:new Date().toISOString(),entries:st.all,receipts,bizs,projects:st.allP,docs:st.allD})],{type:'application/json'});
}

async function shareBackup(){

      const c=new File([blob],nm,{type:ty});if(navigator.canShare&&navigator.canShare({files:[c]})){f=c;break}}

let driveBusy=false;
async function backupDrive(){
  if(driveBusy)return false;
  if(!autoRead){toast('Auto-read is off, so Drive backup is off. Turn on Claude features in Privacy.');return false}
  if(!mcp){toast('Drive backup isn’t available in this view. Use Back up instead.');return false}
  driveBusy=true;toast('Saving to Google Drive…');
  try{
    const blob=await buildBackup(),name=`tally-backup-${today()}.json`;
    const input={title:name,contentMimeType:'application/json',disableConversionToGoogleType:true};
    if(mcpFiles)input.base64Content={$file:{data:blob,name,type:'application/json'}};
    else if(blob.size<700000)input.base64Content=(await blobToDataURL(blob)).split(',')[1];
    else{toast('This backup is too big to send from here. Use Back up and upload it to Drive.');return false}
    const r=await mcp.callTool('Google Drive','create_file',input,{cache:false});
    const pl=r&&r.payload;
    if(pl&&typeof pl==='object'&&pl.id||(r&&r.content&&r.content.length)){try{(localStorage.setItem('tally-lastbackup',today()),localStorage.removeItem('tally-dirty'),bkBar())}catch{}toast('Saved to your Google Drive (My Drive) as '+name);if(st.view==='taxes')render();return true}
    toast('Drive didn’t confirm the save. Check My Drive, or use Back up.');return false;
  }catch(e){
    const c=e&&e.code;
    if(c==='server_not_connected'||c==='selection_required')toast('Connect Google Drive in claude.ai: Settings → Connectors. Then try again.');
    else if(c==='needs_reauth')toast('Reconnect Google Drive in claude.ai: Settings → Connectors.');
    else if(c==='approval_required'||c==='not_in_manifest'||c==='blocked_by_policy'||c==='consent_required')toast('Drive backup wasn’t allowed. Tap it again and choose Allow, or use Back up.');
    else if(c==='cancelled')toast('Stopped.');
    else if(c==='server_unavailable'||c==='upstream_error')toast('Not sure it saved. Check My Drive before trying again.');
    else if(c==='capability_disabled'||c==='not_granted'||c==='capability_removed'||c==='bad_request'||c==='transform_error')toast('Drive backup isn’t available here. Use Back up instead.');
    else toast('Drive couldn’t save it'+(e&&e.message&&c==='tool_error'?': '+String(e.message).slice(0,80):'')+'. Use Back up instead.');
    return false;
  }finally{driveBusy=false}
}

  if(e.target.closest('[data-terms]')){st.view='terms';render();window.scrollTo(0,0);return}
  if(e.target.closest('#goPriv')||e.target.closest('[data-priv]')){st.view='privacy';render();window.scrollTo(0,0);return}
  const pr=e.target.closest('[data-pid]');if(pr){st.pid=pr.dataset.pid;st.view='project';render();window.scrollTo(0,0);return}
  const dc=e.target.closest('[data-doc]');if(dc){const d=st.docs.find(x=>x.id===dc.dataset.doc);if(d)openDoc(d);return}
  const r=e.target.closest('.row[data-id],.rcpt[data-id]');if(r){const en=st.entries.find(x=>x.id===r.dataset.id);if(en)openSheet(en);return}
  const v=e.target.closest('nav [data-view]');if(v){st.view=v.dataset.view;render();window.scrollTo(0,0)}
});
$('#fab').onclick=()=>openSheet(null);
$('#scrim').onclick=closeSheet;
$('#lightbox').onclick=()=>$('#lightbox').classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#lightbox').classList.remove('open');closeSheet()}});
function noFill(root){(root||document).querySelectorAll('input,textarea').forEach(el=>{const t=(el.getAttribute('type')||'text').toLowerCase();if(['checkbox','file','hidden','date','radio','button'].includes(t))return;if(el.getAttribute('autocomplete')!=='off')el.setAttribute('autocomplete','off')})}
new MutationObserver(()=>noFill()).observe(document.body,{childList:true,subtree:true});noFill();

function bkBar(){
  let b=document.getElementById('bkbar');
  let d='';try{d=localStorage.getItem('tally-dirty')||''}catch{}
  if(!d){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='bkbar';
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:92px;z-index:60;background:#1b2330;color:#fff;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;font:600 14px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25)';
    b.innerHTML='<span style="flex:1">New entries not backed up yet</span><button id="bkbarGo" style="background:#fff;color:#5b3a8a;border:0;border-radius:10px;padding:9px 14px;font:700 14px system-ui,sans-serif">Back up now</button>';
    document.body.appendChild(b);
    document.getElementById('bkbarGo').onclick=async()=>{await shareBackup()}}
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
setBook('personal');
load();
bkBar();
</script>
